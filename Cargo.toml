[package]
name = "twitninf-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
idevice = { version = "0.1.65", features = ["usbmuxd"] }
isideload = "0.3.17"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rootcause = "0.12.1"
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["devtools"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
tauri-build = "2.6.3"
