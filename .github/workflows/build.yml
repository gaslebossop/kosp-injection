name: Build & Publish Kosp Injection

# A chaque push sur master : compile l'exe Windows (runtime C en statique,
# voir .cargo/config.toml — pas besoin de VCRUNTIME140.dll sur le poste
# cible) et publie directement la nouvelle version sur le launcher de
# production, en maj forcee, avec le message du commit comme notes de
# version.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: windows-latest
    # L'edition liee (lto = "thin") allonge la compilation : la marge
    # d'origine, 30 minutes, ne laissait pas de place a un cache froid.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Sans cache, chaque push recompile ~600 dependances depuis zero.
      - uses: Swatinem/rust-cache@v2

      # La version publiee sur le launcher etait 1.0.<run>, alors que
      # l'executable annoncait 0.1.0 dans ses proprietes Windows : le
      # numero affiche par le systeme ne correspondait a rien. On aligne
      # les deux avant de compiler.
      - name: Aligner le numero de version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $manifest = Get-Content Cargo.toml -Raw
          $manifest = $manifest -replace '(?m)^version = "[^"]*"', "version = ""$version"""
          Set-Content Cargo.toml $manifest -Encoding utf8 -NoNewline
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version = $version"

      # Le code est actuellement sans le moindre avertissement : tout ce qui
      # apparait ici est nouveau, donc a regarder. L'etape ne bloque pas la
      # publication pour autant — une mise a jour de Rust qui ajoute un
      # nouveau lint ne doit pas empecher une correction urgente de partir.
      - name: Controle qualite (clippy)
        continue-on-error: true
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - name: Empaqueter l'exe
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/twitninf-updater.exe -DestinationPath kosp-win32.zip -Force
          $info = (Get-Item target/release/twitninf-updater.exe).VersionInfo
          Write-Host "FileVersion embarquee : $($info.FileVersion)"

      - name: Publier sur le launcher
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          API="http://51.210.11.74:8080/api/admin"
          SLUG="kosp-injection"

          printf '%s' "$COMMIT_MSG" > notes.txt

          # -w affiche le code HTTP meme en cas d'echec, et sans -f la
          # reponse (souvent un message d'erreur JSON explicite) reste
          # visible dans les logs au lieu d'etre avalee.
          curl -s -w "\nHTTP %{http_code}\n" -X POST "$API/games" \
            -H "x-admin-key: $ADMIN_KEY" -H "Content-Type: application/json" \
            -d "{\"slug\":\"$SLUG\",\"name\":\"Kosp Injection\",\"tagline\":\"Installe et met a jour TwitNinf sur iPhone\",\"category\":\"Outil\",\"accentColor\":\"#FE2C55\",\"accentColor2\":\"#25F4EE\",\"minSupportedVersion\":\"$VERSION\",\"forceUpdate\":true}"

          curl -s -w "\nHTTP %{http_code}\n" -X POST "$API/games/$SLUG/versions" \
            -H "x-admin-key: $ADMIN_KEY" \
            -F "file=@kosp-win32.zip" \
            -F "version=$VERSION" \
            -F "executable=twitninf-updater.exe" \
            -F "platform=win32" \
            -F "notes=<notes.txt"
